name: ABySS
slug: abyss
version_used: '4.8'
edam_topics: []
evidence_spans:
- a *de novo* sequence assembler intended for short paired-end reads and genomes of all sizes
- Some assemblers still in use, such as ABySS, MetaHipmer2, minia, and VelvetOptimiser, perform relatively poorly
- ABySS produced the largest (4.8 Mb versus 4.6 Mb) but also the most fragmented assembly (176 contigs versus 90–95 for Velvet, SPAdes and MEGAHIT)
