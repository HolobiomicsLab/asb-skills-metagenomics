- typically using an approach based on blast [4]
- used by BLASTp to determine representative alleles
- similarity to NCBI viral reference nucleotide sequences using nucleotide BLAST
- BLAST (Altschul et al. 1990) and MEGAN (Huson et al. 2007) have long been foundational in taxonomy assignment
- The most well-known such algorithm, and one of the best methods for assigning a taxonomic label to an unknown sequence, is the BLAST program
- 'we first filtered this dataset by using BLAST: we mapped reads against the whole nucleotide sequence database with a sequence identity of 98%'
- We used BLAST to query the longest unaligned contigs (greater than 100 kb) against the nt database
- the representative sequences of the OTUs can finally be classified using BLAST+ (against a QIIME-formatted database, such as Greengenes11, UNITE12)
- '| Assign | BLAST       | perc_identity | 0.8                  |'
- The program requires BLAST; the version here used was 2.11.0.
- some recent metatranscriptome pipelines (anvi'o, [7], IMP, [8]) rely on BLAST [9] for annotations, which may be unacceptably slow
- Sequence similarity (e.g. via BLAST) is commonly used to assign functional annotations
- SARS-CoV shares about 80% of sequence identity with the bat coronavirus according to BLAST [36].
- ViralCC constructs a phage-host network, which is further validated using CRISPR spacer analyses.
- we aligned these spacers to vMAGs using BLAST with parameters '-task blastn-short -evalue 1e-5'
- '-b : blast option [''blastx'' or ''blastp''] (''blastp'' is faster)'
- SynTracker creates a BLAST database based on a user-provided collection of metagenomic assemblies or genomes.
- NCBI BLAST+
- "### Requirements: \nNCBI BLAST+"
- we convert the collection of per-sample metagenomic assemblies (or genomes) to a basic local alignment search tool (BLAST) database
- '> BLAST 2.12.0+<br>'
