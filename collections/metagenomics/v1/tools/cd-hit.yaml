evidence_spans:
- Filtered sequences are clustered at 99% using cd-hit-est utility to discard chimeric reads.
- CD-HIT 4.6 was run with the parameters -T 16 -M 0 and -n 5 -c 0.9, -n 4 -c 0.7, and -n 3 -c 0.5 for 90%, 70%, and 50%, respectively.
- CD-HIT 4.6 was run with the parameters -T 16 -M 0 and -n 5 -c 0.9, -n 4 -c 0.7, and -n 3 -c 0.5
- CD-HIT (38, 39) is used to cluster sequences in the range of 80% to 100% (with 1% increments) similarity
- the representative protein sequence (identified by CD-HIT) is aligned to reference sequences
- Consensus (cd-hit) and backmapping
- Consensus (cd-hit) and backmapping ([bowtie2](http://bowtie-bio.sourceforge.net/bowtie2/index.shtml))
