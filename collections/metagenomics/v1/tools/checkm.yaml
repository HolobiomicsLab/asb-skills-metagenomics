evidence_spans:
- bin with Bowtie2+MetaBAT2, and assess bins with CheckM
- we used checkm (Parks, 2015) to assess the bins. This found 23 bins with a completeness level of >50%
- '`--checkm` : provide a file with Completenesses and Contaminations (Redundancy)'
- (for example [`checkm`](https://ecogenomics.github.io/CheckM/) output or a fixed value)
- it accepts the output of `checkm` or any other `TAB`-separated file with at least three columns
- genome completeness can be calculated using CheckM (16) or any other tool of your choosing, or a fixed value used
- could be indirectly estimated by using methods such as checkM
- unlike the CheckM which takes advantage of universal single-copy marker genes to assess both completeness and contamination of prokaryotic MAGs
- Similar assessment results were also revealed by other algorithms such as CheckM and BUSCO
