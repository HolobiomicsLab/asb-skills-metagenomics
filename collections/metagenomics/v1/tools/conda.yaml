name: conda
slug: conda
version_used: '4.8'
edam_topics: []
evidence_spans:
- Install baseLess from conda, with the much faster [mamba](https://anaconda.org/conda-forge/mamba) drop-in replacement
- Otherwise just replace `mamba` by `conda`.
- All dependencies are covered by conda.
- conda create -y -n hostile -c conda-forge -c bioconda hostile
- kMetaShot is available through **conda** in _bioconda_ channel.
- The pipeline requires Snakemake and Conda.
- conda install -c bioconda metacortex
- MetaLAFFA requires [**Conda**](https://docs.conda.io/projects/conda/en/latest/user-guide/install/index.html) (version 4.8 or greater) for installation and operation.
- MetaLAFFA requires Conda (version 4.8 or greater) for installation and operation.
- using either Conda, Singularity, or Docker
- containerized using the software container technologies like Docker, Singularity, or Conda
- a software container or environment system such as `conda`, `mamba`, `singularity` or `docker`
- conda env create -n sberry --file environment.yml
- conda create -n cathai -c conda-forge python=3.9 uwsgi=2.0 redis=5.0
- conda create -n maginator -c bioconda -c conda-forge snakemake mamba
- conda install -c conda-forge -c bioconda plass
