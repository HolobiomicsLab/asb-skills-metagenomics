evidence_spans:
- docker build -f Dockerfile_jetson -t baseless .
- To install, first [install Docker](https://docs.docker.com/get-docker/)
- This script will automatically download the Docker image and run ContigExtender with the parameters that are passed to it.
- CAMITAX is run through Nextflow, which, by default, exploits Docker containers
- LMAS relies on the use of Docker [13] containers for each assembler, allowing versions to be tracked and changed easily.
- Docker [17] and Swarm provide containerization and cluster management
- The use of container technologies such as Docker and Singularity enable reproducibility
- a Docker container (Merkel 2014) of Patchwork is also distributed via the BioContainers framework
- using either Conda, Singularity, or Docker
- as a Docker container at https://hub.docker.com/r/aweimann/traitar
- Docker is the only prerequisite for this program to run, all other dependencies are handled by the Dockerfile.
- docker image build --file ./docker/Dockerfile --tag cathai ./docker
- VueGen is distributed as a Python package, Docker image, nf-core module, and desktop application.
- To simplify the installation process and ensure reproducibility, a Docker image is also available and linked in the documentation
- "# install docker\n     docker pull ghcr.io/soedinglab/plass:latest"
- docker pull oma219/spumoni:latest
