evidence_spans:
- we decided to compare the performance of fastp 0.23.2 with the combination of FASTQC and BBduk
- new and faster tools have appeared, such as the widely adopted tool fastp (Chen 2023)
- quality less than `--mean_quality` (default is `15`)
- 'fastp: an ultra-fast all-in-one FASTQ preprocessor'
- fastp is used for adapter and quality trimming
- '* [fastp](https://github.com/OpenGene/fastp) >=0.24.2'
- Short-read paired-end FASTQs are filtered and trimmed using fastp (Chen et al. 2018).
- sequencing reads were quality-controlled by fastp (version 0.20.1) (26) as a multifunctional FASTQ data preprocessing toolkit.
- the sequences were quality checked using fastp to remove leftover adapter sequences and low-quality reads
