evidence_spans:
- GTDB-Tk ([git](https://github.com/Ecogenomics/GTDBTk)
- Each bin can be taxonomically classified using either GTDB-Tk (Chaumeil et al. 2022), or Kraken 2 (Wood et al. 2019)
- All genomes classified as Prochlorococcus_A according to GTDB-Tk (18) found in RefSeq as well as GORG (19) were clustered into mOTUs
- When you add or modify a step, decide which read types it applies to and gate it accordingly (for example, ALE is not run on long reads, Porechop adapter trimming is skipped for PacBio reads, and
- MAGs are taxonomically annotated using GTDB-TK or CAT/BAT
- 600 MAGs could be unambiguously annotated by GTDB-TK
- Run GTDB-tk to taxonomically annotate bins and call open reading frames (ORFs)
- MAG taxonomic classification was determined against GTDB (release 220) using the classification workflow of GTDBtk (v2.4.0)
