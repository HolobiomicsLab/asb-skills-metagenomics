evidence_spans:
- used by Kaiju and Kraken. Only the first three columns are used.
- Kraken (v0.10.4b) and Clark (v1.1.3) were run in their default modes using k=31 for highest precision
- if a k-mer from a sequence has had its LCA value previously set, then the LCA of the stored value and the current sequence’s taxon is calculated and that LCA is stored for the k-mer.
- Kraken is an ultrafast and highly accurate program for assigning taxonomic labels to metagenomic DNA sequences.
