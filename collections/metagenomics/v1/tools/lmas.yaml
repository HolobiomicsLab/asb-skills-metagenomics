evidence_spans:
- '**LMAS** is an **automated workflow enabling the benchmarking** of traditional and metagenomic prokaryotic *de novo* **assembly software using defined mock communities**'
- The `templates <https://github.com/B-UMMI/LMAS/tree/main/templates>`_ folder contains the custom python scripts used by LMAS to process the data and compute the evaluation metrics
- we developed LMAS (Last Metagenomic Assembler Standing), an automated workflow to enable the benchmarking
- LMAS (Last Metagenomic Assembler Standing) was developed as a flexible platform allowing users to evaluate assembler performance given known standard communities.
- Both simulation studies and application to real microbiome data demonstrate that GAMLSS-BEZI well performs in testing differential relative abundances of microbial taxonomies.
