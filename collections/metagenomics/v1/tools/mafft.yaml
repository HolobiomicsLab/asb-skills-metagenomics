evidence_spans:
- The file with the cgMLST MSA was missing from the output directory created by the `AlleleCallEvaluator` module
- A multiple sequence alignment (MSA) was constructed for each of these 957 loci using MAFFT
- 'Mafft (Multiple sequence alignment):'
- Align signature and marker genes, concatenate alignments and infer phylogenetic trees for each MAG cluster
- rebuild the L1 phylogenetic tree with MAFFT/IQ-TREE against NCBI RefSeq papillomavirus genomes (Fig. 5b)
