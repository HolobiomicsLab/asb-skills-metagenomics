evidence_spans:
- binned separately with MetaBAT2 (v2:2.15) [35] (--maxP 99 --minS 98 -m 1,500) to obtain MAGs
- The obtained contigs were binned separately with MetaBAT2 (v2:2.15) [35] (--maxP 99 --minS 98 -m 1,500) to obtain MAGs
- the provided contigs were binned separately with MetaBAT2 (v2:2.15) (--maxP 99 --minS 98 -m 1,500) to obtain MAGs
- Binning is performed with MetaBAT2
- discard contigs <500 bp, bin with Bowtie2+MetaBAT2, and assess bins with CheckM
- binned contigs using MetaBAT2 (Kang, 2019), resulting in 155 genome bins
- one of the main tasks in metagenomic data analysis is to reconstruct the individual genomes directly from the given mixture of metagenomic reads
- MetaBAT2 is then used to bin the contigs into individual MAGs
