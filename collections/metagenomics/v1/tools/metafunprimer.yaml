name: MetaFunPrimer
slug: metafunprimer
version_used: null
edam_topics: []
evidence_spans:
- The first step in the MetaFunPrimer pipeline is to cluster input protein sequences over a range of amino acid sequence similarity thresholds
- Next, MetaFunPrimer evaluates the presence of these genes in user-input reference sequences
- MetaFunPrimer uses selected gene sequences and user-defined parameters, such as amplicon product length and melting temperature ranges, for the subsequent primer design process
- MetaFunPrimer converts all primer outputs to nondegenerate forms (e.g., all possible primer pairs) of forward and reverse primers
- as a final step, MetaFunPrimer outputs the minimal number of primer sets to capture the maximum number of reference gene products
