evidence_spans:
- we tested mOTUs 3.0.3 (Ruscheweyh et al. 2022), MetaPhlAn 4.0.3 (Blanco-Míguez et al. 2023), Bracken 2.8 (Lu et al. 2017) on Kraken2 (Wood et al. 2019) output, and KMA 1.4.7
- 11 times faster than the abundance estimation program MetaPhlAn
- Mapping reads against marker gene databases with tools such as MetaPhlAn1, MetaPhyler2 and mOTUs3 is a fast and effective way of recovering the microbial composition
- Taxonomic analysis of the metagenomes included in VIRGO using MetaPhlAn (v2)19, revealed that these communities contained 312 bacterial species
- ZellerGData <- curatedMetagenomicData("ZellerG_2014.metaphlan_bugs_list*", dryrun = FALSE, counts = TRUE, bugs.as.phyloseq = TRUE)
