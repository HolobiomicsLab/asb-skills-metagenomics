evidence_spans:
- For metagenomes, metaSPAdes is used in-place-of SPAdes.
- Since metaSPAdes has been adopted by many labs, we will use it as our benchmark tool to generate the initial seed contigs to be extended.
- We use SPAdes 3.13.0 with the “-meta” option to enable MetaSPAdes mode. The k-mer sizes were set to 21, 33, 55, and 77
- PE reads were meta-assembled with metaSpades (v3.15.2) [44] and MegaHIT (v1.2.9) [45] (for both -k 35, 57, 79, 99)
- PE reads were meta-assembled with metaSpades (v3.15.2) [44] and MegaHIT (v1.2.9) [45]
- PE reads were meta-assembled with metaSpades (v3.15.2) and MegaHIT (v1.2.9)
- The publication is now available at `https://academic.oup.com/bioinformatics/article/39/1/btad020/6986127
- we also assembled the same datasets using MEGAHIT (v1.1.1), Ray Meta (v2.3.1), MetaVelvet (v1.2.02), metaSPAdes (v3.14) and IDBA-UD (v1.1.2)
- We analyzed the performance of StrainXpress, by comparing it with the available state of the art tools on all of the data sets
- 'metaSPAdes: a new versatile metagenomic assembler'
- Three methods for assembly are included in virMine, namely, SPAdes, metaSPAdes, and MEGAHIT
- Trimmed reads were assembled using metaSPAdes.
