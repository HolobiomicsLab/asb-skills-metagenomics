evidence_spans:
- Hostile requires 4GB of RAM for decontaminating short reads (Bowtie2) and 13GB for long reads (Minimap2)
- Note that Minimap2 mode accepts a path to a genome in fasta format or .mmi
- mapped to the SARS-CoV-2 reference genome (Wuhan variant, NC_045512), using Minimap2 tool19 with a minimal chaining score
- 'Mapping and filtering paramenters:'
- These metrics are calculated for the contigs over *x* basepairs in size, as defined by the minimum contig size in the ``--minLength`` parameter, that map to the reference sequence.
- the contigs are mapped to the reference replicons with minimap2 [32] (version 2.22).
- Additionally, minimap2, pysam, biopython, pandas, matplotlib and numpy were used to perform custom evaluation
- minimap2, pysam, biopython, pandas, matplotlib and numpy were used to perform custom evaluation
- Mapler aligns the reads on the contigs with Minimap2 (Li 2018), and uses these alignments to calculate various metrics.
- short- vs long-read alignment uses Bowtie2 vs minimap2
- '* [Minimap2](https://github.com/lh3/minimap2) >=2.11'
- Following this, minimap2 (Li 2018) is used to map long and short read sets.
- maps all long- and short-reads to the long-read-only assembly using Minimap2 (Li 2018)
- some code snippets from [Minimap2](https://github.com/lh3/minimap2)
- minimap2 -ax map-pb -t 12 ./flye_out/assembly.fasta reads.fq.gz | samtools sort >./flye_out/alignment.sorted.bam
- A minimap2-based alignment of input reads on the output assembly is also available in the `assembly.scaffolds.bam` file.
- A minimap2-based alignment of input reads on the output assembly is also available
- '[minimap2](https://github.com/lh3/minimap2)'
- '- [minimap2](https://github.com/lh3/minimap2)'
- StrainXpress utilizes Minimap2 (25) (version 2.18-r1015) for identifying the suffix-prefix overlaps between two reads as required.
- If a reference genome is provided, the assemblies are aligned against it using minimap2
- SPUMONI has similar accuracy as minimap2 when both are run against an index containing many strains per species.
- This command uses `-P` for computing PMLs (if you want MSs, use `-M` instead) which will be used to classify the reads
- the minimap2 read aligner (Li 2018) to align reads to a reference genome in real time
