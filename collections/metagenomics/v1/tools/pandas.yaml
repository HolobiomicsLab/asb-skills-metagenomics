evidence_spans:
- Jupyter Notebooks supporting the various figures and tables have been shared at https://github.com/genomicepidemiology/argprofiler-paper-notebooks.
- pandas, matplotlib and numpy were used to perform custom evaluation
- 'Possible Python packages you will need: numpy, pandas, matplotlib, linecache, argparse'
- Tabular data sets (CSV or TSV) are internally imported as Pandas Data Frame structures.
- Tabular data sets (CSV or TSV) are internally imported as Pandas Data Frame structures
- MOVIS is built using Python and additional libraries like Pandas [13], Numpy [14], Scikit-learn [15], Biopython [16], Gensim [17], Altair [18], and Streamlit.
- conda install -c bioconda python=3.6 scipy pandas minimap2
- sudo apt-get install python-scipy python-matplotlib python-pip python-pandas
- pandas
- The Python libraries Pandas (v.1.3.2) and NetworkX (v2.6.2) are used for data processing and network generation, respectively.
