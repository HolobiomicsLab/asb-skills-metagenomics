evidence_spans:
- Reads from distinct samples were first separated according to their multiplex identifier using QIIME
- Qiime allows analysis of high-throughput community sequencing data
- Relative abundances of bacterial taxa at various taxonomic levels (from phylum to genus or species) are obtained via the “summarize_taxa.py” script in QIIME1
- While the number of reads discarded by MICCA and QIIME are very similar
- to be compared with 0.027 and 0.028 for QIIME and UPARSE, respectively
- microbiome bioinformatics platforms (e.g., QIIME, Qiita, mothur, JGI GOLD, MG-RAST, EBI, NCBI)
