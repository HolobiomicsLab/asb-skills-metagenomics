evidence_spans:
- GitHub Actions runs the pipeline on this data to ensure it runs through and exits successfully.
- not every tool is valid for every read type
- the quality of the assembly was assessed using QUAST v.5.0.2 (Gurevich et al. 2013)
- Accuracy was assessed using QUAST comparing plasmid assemblies against the ground truth.
- Indels and Mismatches are expressed as median, and per 100 kbp from QUAST.
- Quantities referring to the criteria listed in the corresponding Tables were determined using Quast (40)
- We present WebQUAST, a web server for multifaceted quality assessment and comparison of genome assemblies based on the state-of-the-art QUAST tool.
- QUAST automatically compiles all its sub-parts when needed (on the first use).
- parsing of output of QUAST
- basic usage and parsing of output of QUAST
