evidence_spans:
- extract coverage with SAMtools depth -a
- The read coverage was extracted with SAMtools (20) using the depth command and -a parameter
- Installation with conda/mamba or Docker is recommended due to non-Python dependencies (Bowtie2, Minimap2, Samtools and Bedtools)
- samtools sort -o sample.bam sample.unsort.bam
- samtools coverage ${i}.sorted.bam > ${i}.tab
- We further filtered the resulting BAM files with Samtools (Danecek et al. 2021), removing alternative and supplemental alignments
- '* [Samtools](https://github.com/samtools/samtools) >=0.15.0'
- All unmapped reads and all reads that map to putative plasmid contigs are then extracted using SAMtools (Li et al. 2009)
- samtools (tested with 1.9)
- "samtools (tested with 1.9)  \nhttp://www.htslib.org/doc/"
- samtools faidx ./flye_out/assembly.fasta
- Both `FASTA` and `BAM` files are expected to be indexed with the `samtools faidx` and `samtools index` commands
- Both `FASTA` and `BAM` files are expected to be indexed with the `samtools faidx` and `samtools index` commands, respectively.
- samtools view -F 0x904 -bS MAP.sam > MAP_UNSORTED.bam
- Use the read mappings to collect SNV information for each signature gene and marker gene for each sample
