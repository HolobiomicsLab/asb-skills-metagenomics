name: Snakemake
slug: snakemake
version_used: 5.2.0
edam_topics: []
evidence_spans:
- The ARGprofiler pipeline is a Snakemake workflow that supports the reuse of metagenomic sequencing data
- The pipeline is an easily usable and scalable workflow implemented in Snakemake (Koster and Rahmann 2012, Molder et al. 2021)
- To run pipeline, you need to install Snakemake.
- Snakemake-a scalable bioinformatics workflow engine
- snakemake>=5.2.0
- The pipeline requires Snakemake and Conda.
- Source code is implemented in Python and Bash as a Snakemake pipeline.
- MetaLAFFA is implemented as a Snakemake pipeline, which enables convenient integration with distributed computing clusters
- MetaLAFFA is a Snakemake pipeline configured via Python scripts that manages the functional annotation of shotgun metagenomic data
- MetaLAFFA is implemented as a Snakemake pipeline
- MetaLAFFA is implemented in Snakemake [11], a Python-based workflow management framework that is specifically designed for bioinformatics analysis pipelines.
- Benchmarking, implemented using a reproducible Snakemake pipeline (Mölder et al. 2021) powered by Snaketool (Roach et al. 2022)
- workflow management systems such as Nextflow and Snakemake
- Snakemake arguments are passed through directly to Snakemake
- Snakemake arguments are passed through directly to Snakemake (they are not Snekmer-specific).
- Snekmer is written in Python using Snakemake.
- All you need for running MAGinator is snakemake and mamba.
- It is implemented in Snakemake to take advantage of the integrated work distribution capabilities necessary for processing large-scale metagenomics data.
