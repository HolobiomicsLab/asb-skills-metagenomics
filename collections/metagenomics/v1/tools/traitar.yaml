evidence_spans:
- we have developed Traitar, software that predicts traits of bacteria on the basis of their genomes
- '``traitar -h`` will provide help regarding the different options of traitar.'
- Here we present Traitar, the microbial trait analyzer, an easy-to-use, fully automated software framework for the accurate prediction of currently 67 phenotypes directly from a genome sequence
- traitar requires the Pfam 27.0 HMM models. These are not distributed with this package but need to be downloaded
